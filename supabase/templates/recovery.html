<html>
  <body style="font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: #f5f7fa; padding: 24px;">
    <div style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px;">
      <h1 style="color: #1E3A5F; font-size: 20px; letter-spacing: 2px; text-align: center; margin: 0 0 4px;">SCARNERGY</h1>
      <p style="color: #888; font-size: 13px; text-align: center; margin: 0 0 24px;">Building Inspection Platform</p>

      <h2 style="color: #1A1A2E; font-size: 16px;">Password reset</h2>
      <p style="color: #444; font-size: 14px; line-height: 1.5;">
        Enter this code in the Scanergy app to reset your password:
      </p>

      <!-- The 6-digit OTP consumed by the app's verifyOtp(type: "recovery") flow -->
      <p style="text-align: center; margin: 24px 0;">
        <span style="display: inline-block; background: #EBF5FB; color: #1E3A5F; font-size: 28px; font-weight: 700; letter-spacing: 8px; padding: 12px 24px; border-radius: 8px;">{{ .Token }}</span>
      </p>

      <p style="color: #888; font-size: 12px; line-height: 1.5;">
        The code expires in 1 hour. If you did not request a password reset,
        you can ignore this email — your password will not change.
      </p>
    </div>
  </body>
</html>
